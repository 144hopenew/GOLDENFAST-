function initLogin(){
  var loginBtn=document.getElementById('login-btn');
  var loginError=document.getElementById('login-error');
  loginBtn.classList.remove('loading');

  var tiltBox=document.getElementById('login-box-tilt');
  if(tiltBox){
    tiltBox.style.transition='transform .15s ease-out';
    tiltBox.style.transformStyle='preserve-3d';
    document.getElementById('login-screen').addEventListener('mousemove',function(e){
      var r=tiltBox.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var dx=(e.clientX-cx)/r.width, dy=(e.clientY-cy)/r.height;
      var rx=Math.max(-6,Math.min(6,-dy*10)), ry=Math.max(-6,Math.min(6,dx*10));
      tiltBox.style.transform='perspective(900px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
    });
    document.getElementById('login-screen').addEventListener('mouseleave',function(){
      tiltBox.style.transform='perspective(900px) rotateX(0deg) rotateY(0deg)';
    });
  }

  function doLogin(){
    var u=document.getElementById('login-user').value.trim();
    var p=document.getElementById('login-pass').value.trim();
    var r=document.getElementById('login-role').value;
    if(!u||!p||!r){
      loginError.textContent='กรุณากรอกข้อมูลให้ครบ / 請填寫所有欄位';
      loginError.style.display='block'; return;
    }
    loginBtn.classList.add('loading'); loginBtn.disabled=true;
    setTimeout(function(){
      var users=cloudCache.users||DEFAULT_USERS;
      var found=users.find(function(x){ return x.username===u&&x.password===p; });
      loginBtn.classList.remove('loading'); loginBtn.disabled=false;
      if(!found){
        loginError.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง / 帳號或密碼錯誤';
        loginError.style.color=''; loginError.style.display='block'; return;
      }
      loginError.style.display='none';
      if(r&&found.role&&r!==found.role){
        loginError.textContent='ตำแหน่งที่เลือกไม่ตรงกับบัญชีนี้ กรุณาเลือกตำแหน่งให้ถูกต้อง / 職位與帳號不符，請選擇正確職位';
        loginError.style.color=''; loginError.style.display='block'; return;
      }
      state.currentUser={id:found.id,name:found.name,username:found.username,role:found.role||r};
      var ls=document.getElementById('login-screen');
      ls.style.opacity='0'; ls.style.transition='opacity .4s ease';
      setTimeout(function(){
        ls.style.display='none'; ls.style.opacity='';
        document.getElementById('pct-root').classList.remove('hidden');
        loadState();
      },350);
    },500);
  }
  loginBtn.addEventListener('click',function(e){ e.preventDefault(); doLogin(); });
  document.getElementById('login-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('login-user').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('login-pass').focus(); });
}

(function initFontSizeWidget(){
  var LEVELS=[0.82,0.9,1,1.15,1.3,1.5,1.7];
  var LABELS=['กะทัดรัด','กะทัดรัด+','ปกติ','ใหญ่','ใหญ่+','ใหญ่++','ใหญ่+++'];
  var idx=parseInt(sg('pct:fontScale',null));
  if(idx===null||isNaN(idx)||idx<0||idx>=LEVELS.length) idx=2;
  function apply(){
    document.documentElement.style.zoom=LEVELS[idx];
    ss('pct:fontScale',idx);
    var lbl=document.getElementById('fsw-label');
    if(lbl) lbl.textContent=LABELS[idx];
  }
  var wrap=document.createElement('div');
  wrap.id='font-size-widget';
  wrap.title='ปรับขนาดตัวหนังสือ / 調整字體大小';
  var handle=document.createElement('span');
  handle.textContent='⠿';

  handle.style.cssText='cursor:grab;color:var(--text-dim);font-size:13px;padding:0 3px;user-select:none;touch-action:none;';
  wrap.appendChild(handle);
  var minusBtn=document.createElement('button');
  minusBtn.textContent='ก−';
  minusBtn.addEventListener('click',function(){ if(idx>0){ idx--; apply(); } });
  var label=document.createElement('span');
  label.className='fsw-label'; label.id='fsw-label'; label.textContent=LABELS[idx];
  var plusBtn=document.createElement('button');
  plusBtn.textContent='ก+';
  plusBtn.addEventListener('click',function(){ if(idx<LEVELS.length-1){ idx++; apply(); } });
  wrap.appendChild(minusBtn); wrap.appendChild(label); wrap.appendChild(plusBtn);
  document.body.appendChild(wrap);
  apply();
  var savedPos=null;
  try{ savedPos=JSON.parse(localStorage.getItem('pct:fswPos')||'null'); }catch(e){}
  if(savedPos&&typeof savedPos.left==='number'&&typeof savedPos.top==='number'){
    wrap.style.left=savedPos.left+'px';
    wrap.style.top=savedPos.top+'px';
    wrap.style.right='auto';
  }
  var dragging=false,startX=0,startY=0,origLeft=0,origTop=0;
  handle.addEventListener('pointerdown',function(e){
    dragging=true;
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    var rect=wrap.getBoundingClientRect();
    origLeft=rect.left; origTop=rect.top;
    startX=e.clientX; startY=e.clientY;
    handle.style.cursor='grabbing';
    e.preventDefault();
  });
  handle.addEventListener('pointermove',function(e){
    if(!dragging) return;
    var dx=e.clientX-startX, dy=e.clientY-startY;
    var newLeft=origLeft+dx, newTop=origTop+dy;
    var maxLeft=window.innerWidth-wrap.offsetWidth-4;
    var maxTop=window.innerHeight-wrap.offsetHeight-4;
    newLeft=Math.max(4,Math.min(maxLeft,newLeft));
    newTop=Math.max(4,Math.min(maxTop,newTop));
    wrap.style.left=newLeft+'px';
    wrap.style.top=newTop+'px';
    wrap.style.right='auto';
  });
  function endDrag(e){
    if(!dragging) return;
    dragging=false;
    handle.style.cursor='grab';
    try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
    var rect=wrap.getBoundingClientRect();
    try{ localStorage.setItem('pct:fswPos',JSON.stringify({left:rect.left,top:rect.top})); }catch(err){}
  }
  handle.addEventListener('pointerup',endDrag);
  handle.addEventListener('pointercancel',endDrag);
})();

(function setupPWA(){

    ictx.fillStyle=grad; ictx.fillRect(0,0,512,512);

    ictx.fillText('GDF',256,268);

      start_url:window.location.href.split('#')[0],
      display:'standalone',

      theme_color:'#0b2545',
      icons:[{src:iconUrl,sizes:'512x512',type:'image/png'},{src:iconUrl,sizes:'192x192',type:'image/png'}]
    };
    var manifestBlob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
    var manifestUrl=URL.createObjectURL(manifestBlob);
    var link=document.createElement('link'); link.rel='manifest'; link.href=manifestUrl;
    document.head.appendChild(link);
    var appleIcon=document.createElement('link'); appleIcon.rel='apple-touch-icon'; appleIcon.href=iconUrl;
    document.head.appendChild(appleIcon);
    var themeMeta=document.createElement('meta'); themeMeta.name='theme-color'; themeMeta.content='#0b2545';
    document.head.appendChild(themeMeta);
    if('serviceWorker' in navigator){
      var swCode="self.addEventListener('install',function(e){self.skipWaiting();});"+
        "self.addEventListener('activate',function(e){self.clients.claim();});"+
        "self.addEventListener('fetch',function(e){});"; // pass-through; enables installability without full offline caching
      var swBlob=new Blob([swCode],{type:'application/javascript'});
      var swUrl=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function(){});
    }
  }catch(e){ console.warn('PWA setup skipped:',e); }
})();

(function boot(){
  var loginBtn=document.getElementById('login-btn');
  var loginError=document.getElementById('login-error');
  var loginConn=document.getElementById('login-connecting');
  loginBtn.classList.add('loading'); loginBtn.disabled=true;
  if(loginConn) loginConn.style.display='flex';
  fetchCloudState().then(function(){
    loginBtn.classList.remove('loading'); loginBtn.disabled=false;
    if(loginConn) loginConn.style.display='none';
    subscribeRealtime(); initLogin();
  }).catch(function(e){
    console.error(e);
    loginBtn.classList.remove('loading'); loginBtn.disabled=false;
    if(loginConn) loginConn.style.display='none';
    initLogin();
  });
})();

})();
